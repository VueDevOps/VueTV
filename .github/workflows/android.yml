name: Android checks
on:
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'gradle/**', '*.gradle', 'gradlew*', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'tests/**', 'gradle/**', '*.gradle', 'gradlew*', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: JVM checks
        shell: bash
        run: |
          mkdir -p build/checks
          javac -d build/checks app/src/main/java/je/vu/tvhome/{TimedDiskCache,MotionSpring,AppOrder,ArtworkColors,AvatarStyle,PickRotation,TwitchSession}.java tests/*.java
          for check in CacheCheck MotionCheck HomeFeaturesCheck AvatarCheck PickRotationCheck TwitchSessionCheck; do
            java -cp build/checks je.vu.tvhome.$check
          done
      - uses: actions/upload-artifact@v4
        with:
          name: VueTV-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: app/build/reports/lint-results-debug.html
