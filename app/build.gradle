plugins { id 'com.android.application' }
android {
    namespace 'je.vu.tvhome'
    compileSdk 35
    defaultConfig { applicationId 'je.vu.tvhome'; minSdk 26; targetSdk 35; versionCode 25; versionName '0.20.5' }
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            release {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
