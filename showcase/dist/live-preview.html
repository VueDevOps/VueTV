<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://player.twitch.tv">
  <link rel="preconnect" href="https://gql.twitch.tv" crossorigin>
  <title>Vue TV muted live preview</title>
  <style>html,body,#player{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0b0b}</style>
</head>
<body>
<div id="player"></div>
<script>
'use strict';
(() => {
  const params = new URLSearchParams(location.search);
  const channel = (params.get('channel') || params.get('prepare') || '').toLowerCase();
  let active = !!params.get('channel');
  window.vuePreviewVersion=4;
  const state = window.vuePreviewStatus = {channel, status:active?'loading':'preparing', muted:true, volume:0};
  if (!/^[a-z0-9_]{1,25}$/.test(channel)) { state.status='error'; return; }
  let player, ready=false, playRetries=0;
  function silence() {
    if (!player) return;
    try {
      player.setMuted(true);
      state.muted = player.getMuted() === true;
      state.volume = player.getVolume();
    } catch (_) { state.muted = false; }
  }
  function pause() {
    active=false;
    if (player) { silence(); player.pause(); }
    state.status=ready?'paused':'preparing';
  }
  window.vuePreviewSuspend=pause;
  window.vuePreviewSelect = next => {
    next=String(next).toLowerCase();
    if (!/^[a-z0-9_]{1,25}$/.test(next)) return false;
    active=true;playRetries=0;state.channel=next;state.status='loading';
    if (ready) {
      // setChannel starts the new stream itself. A pause/play pair races the
      // asynchronous channel change and can restart or pause the old stream.
      silence();
      if (player.getChannel().toLowerCase() !== next) player.setChannel(next);
      else player.play();
    }
    return true;
  };
  const script = document.createElement('script');
  script.src='https://player.twitch.tv/js/embed/v1.js';
  script.onerror=()=>{state.status='error';};
  script.onload=()=>{
    try {
      player = new Twitch.Player('player', {width:'100%', height:'100%', channel:state.channel,
        parent:[location.hostname], autoplay:active, muted:true});
      player.addEventListener(Twitch.Player.READY, ()=>{
        ready=true;state.ready=true;silence();
        if (!active) { player.pause();state.status='paused';return; }
        if(player.getChannel().toLowerCase()!==state.channel)player.setChannel(state.channel);
        player.play();
      });
      player.addEventListener(Twitch.Player.PLAYING, ()=>{
        silence();
        if (!active) { player.pause();state.status='paused';return; }
        if (player.getChannel().toLowerCase() === state.channel) state.status='playing';
      });
      const unavailable = status => {
        if (active && player.getChannel().toLowerCase() === state.channel) state.status=status;
      };
      player.addEventListener(Twitch.Player.PLAYBACK_BLOCKED, ()=>unavailable('blocked'));
      player.addEventListener(Twitch.Player.OFFLINE, ()=>unavailable('offline'));
      player.addEventListener(Twitch.Player.ENDED, ()=>unavailable('ended'));
      player.addEventListener(Twitch.Player.PAUSE, ()=>{if(state.status==='playing')state.status='paused';});
      window.setInterval(()=>{
        silence();
        // A play command sent just after WebView resume can be dropped while
        // Android is restoring its surface. Retry only an idle selected player;
        // buffering and background preparation must never trigger another play.
        if(active&&ready&&state.status==='loading'&&playRetries<6&&
            player.getChannel().toLowerCase()===state.channel&&player.isPaused()){
          playRetries++;player.play();
        }
      },500);
    } catch (_) { state.status='error'; }
  };
  document.head.appendChild(script);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('pagehide',pause);
})();
</script>
</body>
</html>
