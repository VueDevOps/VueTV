<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://player.twitch.tv">
  <link rel="preconnect" href="https://gql.twitch.tv" crossorigin>
  <title>Vue TV muted live preview</title>
  <style>html,body,#player{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0b0b}</style>
</head>
<body>
<div id="player"></div>
<script>
'use strict';
(() => {
  const channel = (new URLSearchParams(location.search).get('channel') || '').toLowerCase();
  const state = window.vuePreviewStatus = {channel, status:'loading', muted:true, volume:0};
  if (!/^[a-z0-9_]{1,25}$/.test(channel)) { state.status='error'; return; }
  let player, ready=false;
  function silence() {
    if (!player) return;
    try {
      player.setMuted(true);
      state.muted = player.getMuted() === true;
      state.volume = player.getVolume();
    } catch (_) { state.muted = false; }
  }
  function pause() {
    if (player) { silence(); player.pause(); }
    state.status='paused';
  }
  window.vuePreviewSelect = next => {
    next=String(next).toLowerCase();
    if (!/^[a-z0-9_]{1,25}$/.test(next)) return false;
    state.channel=next;state.status='loading';
    if (ready) {
      // setChannel starts the new stream itself. A pause/play pair races the
      // asynchronous channel change and can restart or pause the old stream.
      silence();player.setChannel(next);
    }
    return true;
  };
  const script = document.createElement('script');
  script.src='https://player.twitch.tv/js/embed/v1.js';
  script.onerror=()=>{state.status='error';};
  script.onload=()=>{
    try {
      player = new Twitch.Player('player', {width:'100%', height:'100%', channel:state.channel,
        parent:[location.hostname], autoplay:true, muted:true});
      player.addEventListener(Twitch.Player.READY, ()=>{
        ready=true;silence();
        if(player.getChannel().toLowerCase()!==state.channel)player.setChannel(state.channel);
        player.play();
      });
      player.addEventListener(Twitch.Player.PLAYING, ()=>{
        silence();
        if (player.getChannel().toLowerCase() === state.channel) state.status='playing';
      });
      const unavailable = status => {
        if (player.getChannel().toLowerCase() === state.channel) state.status=status;
      };
      player.addEventListener(Twitch.Player.PLAYBACK_BLOCKED, ()=>unavailable('blocked'));
      player.addEventListener(Twitch.Player.OFFLINE, ()=>unavailable('offline'));
      player.addEventListener(Twitch.Player.ENDED, ()=>unavailable('ended'));
      player.addEventListener(Twitch.Player.PAUSE, ()=>{if(state.status==='playing')state.status='paused';});
      window.setInterval(silence,1000);
    } catch (_) { state.status='error'; }
  };
  document.head.appendChild(script);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('pagehide',pause);
})();
</script>
</body>
</html>
